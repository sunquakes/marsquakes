services:
  # Backend API (JeecgBoot 3.9.3 / Spring Boot / Java 17)
  # The bare Dockerfile has no compile stage; it packages an already-built jar.
  # To compile inside the image instead: docker compose -f docker-compose.build.yml build
  api:
    build:
      # Build context is always the repository root, matching the mars CLI behaviour
      context: .
      dockerfile: apps/api/Dockerfile
    image: marsquakes/api:3.9.3
    # Container name / hostname MUST be marsquakes-api:
    # the edge nginx config, the web-admin nginx proxy and .env.docker
    # hard-code this address
    container_name: marsquakes-api
    hostname: marsquakes-api
    # Not published to the host: reachable only inside the Docker network via
    # the edge nginx service (public entry point on port 80).
    expose:
      - '8817'
    # To override the config bundled in the jar, create apps/api/config first, then uncomment
    # volumes:
    #   - ./apps/api/config:/jeecg-boot/config
    environment:
      # External MySQL (not part of this stack; injected via .env or the environment)
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL: jdbc:mysql://${MYSQL_HOST:-host.docker.internal}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-jeecg-boot}?characterEncoding=UTF-8&useUnicode=true&useSSL=false&tinyInt1isBit=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_USERNAME: ${MYSQL_USERNAME:-root}
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD: ${MYSQL_PASSWORD:-root}
      # External Redis
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_DATABASE: ${REDIS_DATABASE:-0}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JEECG_REDISSON_ADDRESS: ${REDIS_HOST:-host.docker.internal}:${REDIS_PORT:-6379}
      JEECG_REDISSON_PASSWORD: ${REDIS_PASSWORD:-}
    extra_hosts:
      # Make host.docker.internal resolve to the host on Linux as well
      - 'host.docker.internal:host-gateway'
    networks:
      - jeecg-boot
    restart: on-failure

  # Admin frontend (JeecgBoot Vue3 / Vite); the build output is served by nginx.
  # Its nginx proxies /marsquakes-api/ to
  # http://marsquakes-api:8817/marsquakes-api/, but traffic now reaches it
  # through the edge nginx service below.
  web-admin:
    build:
      context: .
      dockerfile: apps/web-admin/Dockerfile
    image: marsquakes/web-admin:3.9.3
    container_name: marsquakes-web-admin
    hostname: marsquakes-web-admin
    # Not published to the host: reachable only inside the Docker network via
    # the edge nginx service (public entry point on port 80).
    expose:
      - '80'
    depends_on:
      - api
    networks:
      - jeecg-boot
    restart: on-failure

  # Edge reverse proxy: the only service published to the host.
  # Listens on port 80; / goes to the frontend and /marsquakes-api/ goes to the API.
  nginx:
    image: nginx:stable-alpine
    container_name: marsquakes-nginx
    hostname: marsquakes-nginx
    ports:
      - '${NGINX_HOST_PORT:-80}:80'
    volumes:
      - ./apps/web-admin/edge-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web-admin
    networks:
      - jeecg-boot
    restart: on-failure

networks:
  jeecg-boot:
    name: jeecg_boot
    driver: bridge
