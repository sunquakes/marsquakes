<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Marsquakes">
  <!--
    Coarse cut of the logo.svg mark for browser tabs.
    Downscaled to 16px, so the disc is full-bleed, only two craters survive and
    the seismograph trace is thickened; the epicentre ring is dropped because it
    collapses into the stroke at that size.
  -->
  <defs>
    <radialGradient id="mq-favicon-surface" cx="34%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#e4705a" />
      <stop offset="58%" stop-color="#b3312c" />
      <stop offset="100%" stop-color="#71201b" />
    </radialGradient>
    <clipPath id="mq-favicon-disc">
      <circle cx="16" cy="16" r="16" />
    </clipPath>
  </defs>

  <circle cx="16" cy="16" r="16" fill="url(#mq-favicon-surface)" />

  <g clip-path="url(#mq-favicon-disc)" fill="#8a2621" opacity="0.55">
    <ellipse cx="24.4" cy="23.4" rx="4.8" ry="4" />
    <circle cx="6.6" cy="8" r="2.6" />
  </g>

  <path d="M2 18.4 h4.4 l2.9 -8.2 l4.1 15.2 l3.5 -11.2 l2.5 4.2 h6.6"
        fill="none" stroke="#fff1ef" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round" />
</svg>
