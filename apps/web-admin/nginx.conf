server {
    listen 80;

    # Resolve at runtime through the embedded Docker DNS, so nginx still starts
    # when the backend is not up yet
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /marsquakes-api/ {
        set $marsquakes_api marsquakes-api;
        rewrite ^/marsquakes-api/?(.*)$ /marsquakes-api/$1 break;
        proxy_pass       http://$marsquakes_api:8817;
        proxy_redirect   off;
        proxy_set_header Host marsquakes-api;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket (required by message push, online users, etc.)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        root  /var/www/html/;
        index index.html index.htm;
        # SPA history-mode fallback
        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.html?s=$1 last;
            break;
        }
    }

    access_log /var/log/nginx/access.log;
}
